services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: apuriva
      POSTGRES_PASSWORD: apuriva
      POSTGRES_DB: apuriva
    ports:
      - '5432:5432'
    volumes:
      - apuriva-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U apuriva -d apuriva']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  apuriva-postgres-data:
